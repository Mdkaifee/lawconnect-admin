services:
  - type: web
    name: rishikesh-law-hub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: CHAT_MESSAGE_FREE_LIMIT
        value: "5"
      - key: CHAT_UNLOCK_AMOUNT
        value: "11"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: AI_PROVIDER
        value: claude
